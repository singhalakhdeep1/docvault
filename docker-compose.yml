services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: docsvault
      POSTGRES_PASSWORD: docsvault
      POSTGRES_DB: docsvault
    ports:
      - "5432:5432"
    volumes:
      - docsvault_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: meili
    ports:
      - "7700:7700"
    volumes:
      - docsvault_meili:/meili_data

  minio:
    image: minio/minio:RELEASE.2024-01-15T23-04-12Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - docsvault_minio:/data

volumes:
  docsvault_pg:
  docsvault_meili:
  docsvault_minio:

